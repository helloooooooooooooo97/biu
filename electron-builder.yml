appId: os.biu.app
productName: Biu
copyright: Apache-2.0
artifactName: Biu-${version}-${os}-${arch}.${ext}
directories:
  output: release
  app: pack-app
files:
  - "**/*"
# extraResources 的 glob 会从 app 文件里排除同名路径。
# 所以 host 整包放 pack-host/，不要在这里写裸的 package.json。
extraResources:
  - from: pack-host
    to: biu
asar: false
npmRebuild: false
publish:
  provider: github
  releaseType: release
mac:
  category: public.app-category.developer-tools
  icon: public/favicon.svg
  identity: '-'
  gatekeeperAssess: false
  hardenedRuntime: false
  notarize: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
win:
  icon: public/favicon.svg
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  shortcutName: Biu
  uninstallDisplayName: Biu
linux:
  target:
    - target: dir
      arch:
        - x64
