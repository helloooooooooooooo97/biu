name: desktop-release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
          - os: windows-latest
            name: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Pack desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run electron:pack
      - uses: actions/upload-artifact@v4
        with:
          name: biu-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip
            release/*.yml
            release/*.blockmap
          compression-level: 0
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.exe
            release/*.zip
            release/*.yml
            release/*.blockmap
          generate_release_notes: true
          body: |
            ## macOS 怎么装（未公证，第一次不要双击）

            能装、能用。第一次会被系统拦住，**右键打开一次之后就可以双击。**

            1. 打开 dmg，把 Biu 拖进「应用程序」
            2. 在「应用程序」里 **Control+点按 / 右键 Biu → 打开 → 打开**
            3. 若仍提示已损坏，终端执行一次：
            ```bash
            xattr -dr com.apple.quarantine /Applications/Biu.app
            open /Applications/Biu.app
            ```

            Apple 芯片用 `*-mac-arm64.dmg`，Intel 用 `*-mac-x64.dmg`。

            Windows：SmartScreen → 更多信息 → 仍要运行。

            完整说明见 `docs/desktop-install.md`。
