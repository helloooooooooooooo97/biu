name: desktop-release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
          - os: windows-latest
            name: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Pack desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run electron:pack
      - uses: actions/upload-artifact@v4
        with:
          name: biu-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip
            release/*.yml
            release/*.blockmap
          compression-level: 0
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.exe
            release/*.zip
            release/*.yml
            release/*.blockmap
          generate_release_notes: true
          body: |
            ## 安装注意（未公证 / 未签名）

            **macOS 没有 Apple 开发者证书，不能公证。** 浏览器下载后 Gatekeeper 会隔离应用，双击常显示「已损坏」或无法打开。这不是安装包坏了。

            1. 把 `Biu-*-mac-*.dmg` 里的 Biu 拖进「应用程序」
            2. **不要双击**：在 Launchpad / Finder 里 **右键 → 打开**，再点打开
            3. 若仍提示已损坏，在终端执行：
            ```bash
            xattr -dr com.apple.quarantine /Applications/Biu.app
            ```

            Windows 未做 Authenticode 签名时，SmartScreen 可能拦截：更多信息 → 仍要运行。

            完整说明见仓库 `docs/desktop-install.md`。
